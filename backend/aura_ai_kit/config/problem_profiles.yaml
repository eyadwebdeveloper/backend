# =========================================================================
# INJECTED PROBLEM PROFILES (simulator ground truth)
#
# The DIRECTION of each effect follows the published finding named in
# `direction_source`. Magnitudes, timings and prevalences are ENGINEERING
# PLACEHOLDERS chosen to exercise the pipeline. The medical teammates must
# approve whether the injected problems look realistic (AI plan, section 7:
# "The medics approve whether the injected problems look realistic").
# =========================================================================

problems:

  infection_like:
    label: Short infection-like event
    applies_to: body                # assigned per astronaut
    direction_source: >-
      Mishra et al. 2020, Nature Biomedical Engineering: rises in resting
      heart rate relative to a person's own baseline can precede illness
      symptoms. Direction only; magnitude is a placeholder.
    onset_range: {min_day: 25, max_day: 150}
    ramp_days: 2
    duration_days: [5, 9]           # total episode length from onset
    recovery_days: 3
    prevalence: 0.25
    body_effects:
      resting_hr:  {mult: 1.10}
      hrv_rmssd:   {mult: 0.82}
      sleep_hours: {add: -0.7}
      skin_temp_c: {add: 0.5}

  deconditioning:
    label: Cardiovascular deconditioning (slow drift)
    applies_to: body
    direction_source: >-
      Pooled head-down-tilt bed rest campaigns: HRV power decreases during
      bed rest (weaker autonomic control); cardiovascular deconditioning
      shows as higher resting heart rate and lower HRV over weeks.
      Direction only; magnitude is a placeholder.
    onset_range: {min_day: 25, max_day: 70}
    ramp_days: 45
    duration_days: [90, 140]        # episode persists to mission end
    recovery_days: 0
    prevalence: 0.35
    body_effects:
      resting_hr:  {mult: 1.07}
      hrv_rmssd:   {mult: 0.75}
      sleep_hours: {add: -0.3}

  behavioral_decline:
    label: Behavioral health decline (isolation and confinement)
    applies_to: body
    direction_source: >-
      NASA Human Research Program hazard: isolation and confinement can
      contribute to behavioral health problems (sleep, mood, fatigue).
      Direction only; magnitude is a placeholder.
    onset_range: {min_day: 30, max_day: 120}
    ramp_days: 21
    duration_days: [40, 80]
    recovery_days: 10
    prevalence: 0.20
    body_effects:
      sleep_hours:   {add: -0.9}
      mood_score:    {add: -1.3}
      fatigue_score: {add: 1.2}
      hrv_rmssd:     {mult: 0.92}

  co2_scrubber_fault:
    label: Cabin CO2 scrubber fault (hostile closed environment)
    applies_to: station             # one cabin environment, affects its crew
    direction_source: >-
      NASA literature reports CO2 excursions on the ISS; elevated CO2 is
      associated with headaches and poorer sleep. Direction only; magnitude
      is a placeholder.
    onset_range: {min_day: 30, max_day: 140}
    ramp_days: 4
    duration_days: [10, 16]
    recovery_days: 3
    prevalence: 0.35                # per station
    station_effects:
      co2_ppm: {mult: 2.2}
    body_effects:                   # indirect crew response
      sleep_hours: {add: -0.6}
      resting_hr:  {mult: 1.02}

# ------------------------------------------------------------------------
# Sensor and data-quality faults. These must produce SENSOR MESSAGES only,
# never health alerts (AI plan, Tier 0: "data quality first").
# ------------------------------------------------------------------------
dq_faults:
  missing_days: {per_day_prob: 0.06}                     # per signal per day
  dead_sensor:  {prevalence: 0.30, length_days: [4, 8]}  # per astronaut
  stuck_value:  {prevalence: 0.25, length_days: [5, 10]} # per astronaut
  spike_bursts: {per_day_prob: 0.01}                     # per signal per day
