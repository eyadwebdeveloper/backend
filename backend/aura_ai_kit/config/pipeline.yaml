# =========================================================================
# AURA AI kit - top-level pipeline configuration
# All values are engineering placeholders unless marked otherwise.
# =========================================================================

seed: 2026

mission:
  n_days: 180                    # simulated mission length in days
  n_train_astronauts: 40         # virtual astronauts used for training
  n_test_astronauts: 20          # held-out virtual astronauts (never seen in training)
  stations_per_split: 2          # cabin environments; train and test stations are disjoint
  force_clean_fraction: 0.30     # at least this share of test astronauts gets no problem
  ensure_test_problems:          # test split always contains at least one of each
    [infection_like, deconditioning, behavioral_decline]
  ensure_test_station_problem: true   # and at least one CO2 scrubber fault

notices:                         # AI plan section 5, starting settings (medics + engineers to tune)
  consecutive_days: 3            # a notice fires only after N checks in a row are high
  cooldown_days: 1               # same notice not repeated more than about once per day
  high_quantile: 0.95            # strangeness threshold from training-normal distribution

models:
  tier1a:
    primary: isolation_forest
    comparison: autoencoder      # small autoencoder as the comparison model
    contamination: 0.02
  tier1b:
    primary: isolation_forest
    contamination: 0.02
  tier2a:
    classifier: logistic_regression
  tier2b:
    input_window_days: 30
    horizon_days: 14             # forecast 7 to 14 days; report both horizons
    learned_backend: auto        # auto = GRU if PyTorch is installed, else ridge regression

stress:                          # stress test (AI plan section 7, step 5)
  noise_multiplier: 1.5          # extra Gaussian noise at 1.5x the simulator sigma
  extra_dropout_prob: 0.20       # extra missing days

output:
  results_dir: results
