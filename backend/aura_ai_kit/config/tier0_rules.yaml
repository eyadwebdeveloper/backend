# =========================================================================
# TIER 0 RULES - ENGINEERING PLACEHOLDERS, NOT MEDIC-APPROVED
#
# Every numeric value in this file is a stand-in chosen by the engineering
# team so the pipeline can be exercised end to end. The medical teammates
# OWN the real values (AI plan: "rules written and reviewed by the medical
# teammates, stored in an editable file the code only reads").
#
# The engine reads this file only. Changing a value here changes system
# behavior without touching code. Rule DIRECTIONS follow published findings
# named in the kit README; magnitudes are placeholders.
# =========================================================================

settings:
  ewma_alpha: 0.20               # fast personal tracker, weights recent days more
  reference_window_days: 30      # long-term personal reference (mission-start window)
  min_reference_samples: 15      # clean samples needed before personal rules activate
  cold_start_days: 14            # personal rules inactive before this mission day
  trend_window_days: 30          # straight-line trend window (days-to-limit note)
  flatline_window_days: 5        # rolling window for stuck-sensor detection
  flatline_tol_frac: 0.15        # rolling std below this fraction of robust sd = stuck
  gap_max_days: 2                # a data gap longer than this raises a stale-sensor message

# Level order: informational < watch < elevated < urgent_review
# Only Tier 0 (this file's engine) can create these alert levels.

body_signals:
  resting_hr:
    unit: bpm
    dq_range: [35, 160]          # outside this range = sensor message, never a health alert
    absolute:
      urgent_review: {low: 40, high: 140}
      elevated: {low: 45, high: 120}
    personal:
      direction: upper           # high values are the concern
      z_watch: 2.0               # robust z vs personal reference
      duration_days: 3           # sustained this many days before a watch alert
      rate_7d_z: 2.5             # week-over-week change, in robust sigmas
      drift_ref_z: 2.0           # 14-day mean vs mission-start reference (slow drift)
      drift_duration_days: 5
  hrv_rmssd:
    unit: ms
    dq_range: [5, 200]
    absolute: null
    personal:
      direction: lower           # drops are the concern
      z_watch: 2.0
      duration_days: 3
      rate_7d_z: 2.5
      drift_ref_z: 2.0
      drift_duration_days: 5
  sleep_hours:
    unit: h
    dq_range: [0, 14]
    absolute: null
    personal:
      direction: lower
      z_watch: 2.0
      duration_days: 3
      rate_7d_z: null
      drift_ref_z: 2.0
      drift_duration_days: 7
  active_min:
    unit: min
    dq_range: [0, 400]
    absolute: null
    personal:
      direction: lower
      z_watch: 2.0
      duration_days: 3
      rate_7d_z: null
      drift_ref_z: 2.0
      drift_duration_days: 7
  skin_temp_c:
    unit: degC
    dq_range: [28, 42]
    absolute: null
    personal:
      direction: upper
      z_watch: 2.0
      duration_days: 3
      rate_7d_z: null
      drift_ref_z: null
      drift_duration_days: null
  mood_score:
    unit: "self-report, 1-5"
    dq_range: [1, 5]
    absolute: null
    personal:
      direction: lower           # mood well below one's own normal is the concern
      z_watch: 2.0
      duration_days: 3
      rate_7d_z: null
      drift_ref_z: null
      drift_duration_days: null
  fatigue_score:
    unit: "self-report, 1-5"
    dq_range: [1, 5]
    absolute: null
    personal:
      direction: upper
      z_watch: 2.0
      duration_days: 3
      rate_7d_z: null
      drift_ref_z: null
      drift_duration_days: null

checkin_signals:                 # absolute backstop thresholds on raw self-report
  mood_score:
    scale: [1, 5]
    watch_below: 2               # mood at or below 2 for 3 days = watch
    duration_days: 3
  fatigue_score:
    scale: [1, 5]
    watch_above: 4               # fatigue at or above 4 for 3 days = watch
    duration_days: 3

cabin_signals:                   # station environment, shared per station
  co2_ppm:
    unit: ppm
    dq_range: [300, 20000]
    absolute:
      elevated: {low: null, high: 5000}   # placeholder; real limits are flight rules
      watch: {low: null, high: 3500}
    personal:
      direction: upper
      z_watch: 2.5
      duration_days: 2
  cabin_temp_c:
    unit: degC
    dq_range: [15, 35]
    absolute: null
    personal:
      direction: both
      z_watch: 3.0
      duration_days: 2
  rh_pct:
    unit: "%"
    dq_range: [20, 80]
    absolute: null
    personal:
      direction: both
      z_watch: 3.0
      duration_days: 2
  noise_db:
    unit: dB
    dq_range: [30, 100]
    absolute: null
    personal:
      direction: upper
      z_watch: 2.5
      duration_days: 2
  dose_usv_day:
    unit: uSv/day
    dq_range: [0, 10000]
    absolute: null
    personal:
      direction: upper
      z_watch: 3.0
      duration_days: 1
    note: >-
      Cabin dose rate is context only and is never a personal dose
      (AI plan, hazard table). Alerts here are environmental, not medical.

# Tier 1b advisory context labels (engineering placeholders; the medics own wording)
context_labels:
  high_co2_exposure:
    signal: co2_ppm
    z_min: 2.5
    min_days: 2
    text: >-
      Cabin CO2 has been above the station's usual range; this can affect
      sleep and how you feel.
  noisy_environment:
    signal: noise_db
    z_min: 2.5
    min_days: 2
    text: >-
      The cabin has been noisier than usual; check whether your sleep area
      is affected.
  elevated_radiation_context:
    signal: dose_usv_day
    z_min: 3.0
    min_days: 1
    text: >-
      Cabin radiation level is higher than usual. Context only: a cabin
      reading is not a personal dose.
